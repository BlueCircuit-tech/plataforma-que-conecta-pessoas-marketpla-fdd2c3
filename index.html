<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Conecta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#FBF9EE', 100: '#F5F0CC', 200: '#EBE099',
              300: '#DFD066', 400: '#D4C040', 500: '#D4AF37',
              600: '#B8952F', 700: '#8C6F23', 800: '#614A17',
              900: '#36260C'
            },
            base: {
              50: '#FAFAFA', 100: '#F0F0F0', 200: '#E0E0E0',
              300: '#B0B0B0', 400: '#808080', 500: '#505050',
              600: '#303030', 700: '#1A1A1A', 800: '#111111',
              900: '#0A0A0A'
            }
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            body: ['"Source Sans 3"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            app: '0 4px 24px rgba(0,0,0,0.10)',
            card: '0 2px 12px rgba(0,0,0,0.07)',
            float: '0 8px 32px rgba(0,0,0,0.13)',
            nav: '0 -4px 20px rgba(0,0,0,0.10)',
            gold: '0 0 24px rgba(212,175,55,0.25)'
          },
          borderRadius: {
            app: '20px',
            card: '14px',
            pill: '999px'
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { font-family: 'Source Sans 3', system-ui, sans-serif; background: #E8E8E8; height: 100%; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }

    .device-frame {
      width: 100%; height: 100%; background: #0A0A0A;
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }
    @media (min-width: 500px) {
      .device-frame {
        width: 390px; height: 780px; border-radius: 44px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.35), 0 0 0 3px #1A1A1A;
      }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    [data-tela] { animation: fadeInUp .38s cubic-bezier(.22,1,.36,1) both; }

    .nav-btn.ativo { color: #D4AF37; }
    .nav-btn.ativo svg { stroke: #D4AF37; fill: rgba(212,175,55,0.15); }
    .nav-btn.ativo::after {
      content: ''; position: absolute; top: -1px; left: 25%; right: 25%;
      height: 2.5px; background: #D4AF37; border-radius: 0 0 4px 4px;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.25); border-radius: 4px; }

    *:focus-visible { outline: 2px solid #D4AF37; outline-offset: 2px; border-radius: 4px; }
    button { -webkit-user-select: none; user-select: none; }

    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 600;
      letter-spacing: .03em; text-transform: uppercase;
    }
    .card {
      background: #FFFFFF; border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      overflow: hidden; transition: transform .22s ease, box-shadow .22s ease;
    }
    .card:active { transform: scale(0.975); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .65rem 1.4rem; border-radius: 999px; font-weight: 600; font-size: .9rem;
      border: none; cursor: pointer; transition: all .2s ease; white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); opacity: 0.88; }
    .btn-primary { background: #D4AF37; color: #0A0A0A; }
    .btn-primary:hover { background: #E5C04A; box-shadow: 0 4px 16px rgba(212,175,55,0.35); }
    .btn-dark { background: #0A0A0A; color: #D4AF37; }
    .btn-dark:hover { background: #1A1A1A; }
    .btn-outline {
      background: transparent; color: #FAFAFA; border: 1.5px solid rgba(250,250,250,0.25);
    }
    .btn-outline:hover { border-color: #D4AF37; color: #D4AF37; }

    .toast-enter { animation: toastIn .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(60px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .toast-exit { animation: toastOut .28s ease both; }
    @keyframes toastOut {
      to { opacity: 0; transform: translateX(60px); }
    }
    #toast-box > * { margin-bottom: .5rem; }
    #modal-overlay { backdrop-filter: blur(6px); }
  </style>
</head>
<body>
  <div class="device-frame" id="app-frame">

    <!-- Status bar -->
    <div class="shrink-0 h-11 bg-marca-900 flex items-center justify-between px-7 select-none" style="padding-top:env(safe-area-inset-top,0)">
      <span class="text-marca-500 text-sm font-semibold font-body tracking-wide" id="sb-hora">19:30</span>
      <div class="flex items-center gap-1.5">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="5" width="3" height="7" rx=".6" fill="#D4AF37" opacity=".4"/><rect x="4.5" y="4" width="3" height="8" rx=".6" fill="#D4AF37" opacity=".6"/><rect x="9" y="2.5" width="3" height="9.5" rx=".6" fill="#D4AF37" opacity=".8"/><rect x="13.5" y="0.8" width="2.5" height="11.2" rx=".6" fill="#D4AF37"/></svg>
        <svg width="14" height="12" viewBox="0 0 14 12" fill="none"><path d="M7 2.5C9.5 2.5 11.7 3.6 13.2 5.3L14.3 4C12.4 1.9 9.8.5 7 .5S1.6 1.9-.3 4L.8 5.3C2.3 3.6 4.5 2.5 7 2.5z" fill="#D4AF37" opacity=".5"/><path d="M7 5.5C8.7 5.5 10.2 6.3 11.3 7.5L12.3 6.5C10.9 4.8 9 3.9 7 3.9S3.1 4.8 1.7 6.5L2.7 7.5C3.8 6.3 5.3 5.5 7 5.5z" fill="#D4AF37" opacity=".7"/><circle cx="7" cy="10" r="1.5" fill="#D4AF37"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0" y="0" width="22" height="12" rx="3" stroke="#D4AF37" stroke-width="1" fill="none" opacity=".6"/><rect x="22.5" y="3.5" width="2" height="5" rx=".8" fill="#D4AF37" opacity=".5"/><rect x="1.5" y="1.5" width="17" height="9" rx="1.5" fill="#D4AF37"/></svg>
      </div>
    </div>

    <!-- App container -->
    <div class="flex-1 flex flex-col bg-base-900 relative overflow-hidden">
      <!-- Header -->
      <header class="shrink-0 bg-marca-900 px-5 pt-4 pb-3 flex items-center justify-between shadow-md z-20">
        <div class="flex items-center gap-2.5">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <circle cx="17" cy="17" r="16" fill="#D4AF37"/>
            <circle cx="17" cy="17" r="12" fill="#0A0A0A"/>
            <path d="M17 8 C12 8 10 12 10 14 C10 18 13 20 17 20 C21 20 24 18 24 14 C24 12 22 8 17 8Z" fill="#D4AF37"/>
            <line x1="17" y1="12" x2="17" y2="26" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="font-display text-xl font-bold text-marca-500 tracking-tight">Conecta</span>
        </div>
        <div class="flex items-center gap-3">
          <button class="text-marca-500 hover:text-marca-400 transition-colors p-1 relative" data-nav="notificacoes" onclick="mostrarTela('notificacoes')" aria-label="Notificações">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-red-500 rounded-full text-white text-[.6rem] flex items-center justify-center font-bold">3</span>
          </button>
          <div class="w-8 h-8 rounded-full bg-marca-500 flex items-center justify-center text-base-900 font-bold text-sm cursor-pointer" data-nav="perfil" onclick="mostrarTela('perfil')" aria-label="Perfil">MC</div>
        </div>
      </header>

      <!-- Telas -->
      <main class="flex-1 overflow-y-auto overflow-x-hidden relative">
        <!-- TELAS -->
      </main>

      <!-- Bottom nav -->
      <nav class="shrink-0 bg-base-900/95 backdrop-blur-lg border-t border-white/5 px-2 pt-1.5 pb-2 relative z-30" style="box-shadow:0 -4px 20px rgba(0,0,0,0.15)">
        <div class="flex items-start justify-around">
          <button class="nav-btn ativo flex flex-col items-center gap-0.5 p-1.5 text-marca-500 relative transition-colors" data-nav="home" data-tela="home" onclick="mostrarTela('home')" aria-label="Home">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="text-[.62rem] font-semibold">Home</span>
          </button>
          <button class="nav-btn flex flex-col items-center gap-0.5 p-1.5 text-base-300 relative transition-colors" data-nav="explorar" data-tela="explorar" onclick="mostrarTela('explorar')" aria-label="Explorar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span class="text-[.62rem] font-semibold">Explorar</span>
          </button>
          <button class="nav-btn flex flex-col items-center gap-0.5 p-1.5 text-base-300 relative transition-colors -mt-5" data-nav="anunciar" data-tela="anunciar" onclick="mostrarTela('anunciar')" aria-label="Anunciar">
            <div class="w-11 h-11 rounded-full bg-marca-500 flex items-center justify-center shadow-gold">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </div>
            <span class="text-[.62rem] font-semibold mt-0.5">Anunciar</span>
          </button>
          <button class="nav-btn flex flex-col items-center gap-0.5 p-1.5 text-base-300 relative transition-colors" data-nav="carrinho" data-tela="carrinho" onclick="mostrarTela('carrinho')" aria-label="Carrinho">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span class="text-[.62rem] font-semibold">Carrinho</span>
          </button>
          <button class="nav-btn flex flex-col items-center gap-0.5 p-1.5 text-base-300 relative transition-colors" data-nav="chat" data-tela="chat" onclick="mostrarTela('chat')" aria-label="Chat">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="text-[.62rem] font-semibold">Chat</span>
          </button>
        </div>
      </nav>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toast-box" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[999] flex flex-col items-center pointer-events-none" style="width:min(380px,calc(100vw - 2rem))"></div>

  <!-- Modal -->
  <div id="modal-overlay" class="fixed inset-0 z-[998] bg-black/60 hidden items-center justify-center p-5" onclick="if(event.target===this)fecharModal()">
    <div class="bg-white rounded-2xl w-full max-w-sm max-h-[80vh] flex flex-col shadow-float">
      <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <h3 id="modal-titulo" class="font-display text-lg font-bold text-base-900"></h3>
        <button onclick="fecharModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-base-400 hover:text-base-900 hover:bg-gray-200 transition-colors" aria-label="Fechar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-conteudo" class="p-5 overflow-y-auto"></div>
    </div>
  </div>

  <script>
    // ── Relógio da barra de status ──
    (function () {
      var el = document.getElementById('sb-hora');
      if (!el) return;
      function tick() {
        var d = new Date();
        el.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }
      tick(); setInterval(tick, 30000);
    })();

    // ── Utilitários ──
    function toast(mensagem, tipo) {
      var box = document.getElementById('toast-box');
      var cores = { ok: 'bg-green-500', erro: 'bg-red-500', info: 'bg-base-900' };
      var icones = {
        ok: '<svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>',
        erro: '<svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info: '<svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
      };
      var div = document.createElement('div');
      div.className = 'toast-enter pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl text-white shadow-float text-sm font-medium font-body';
      div.classList.add(cores[tipo] || cores.info);
      div.innerHTML = (icones[tipo] || icones.info) + '<span>' + mensagem + '</span>';
      box.appendChild(div);
      setTimeout(function () {
        div.classList.remove('toast-enter');
        div.classList.add('toast-exit');
        setTimeout(function () { div.remove(); }, 300);
      }, 3000);
    }

    function abrirModal(html, titulo) {
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-conteudo').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('modal-overlay').classList.add('flex');
    }
    function fecharModal() {
      var o = document.getElementById('modal-overlay');
      o.classList.add('hidden'); o.classList.remove('flex');
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharModal(); });

    function brl(valor) { return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function dataBR(iso) {
      if (!iso) return '';
      var d = new Date(iso + 'T00:00:00');
      return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    }

    // ── Roteador ──
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }
    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('home');
    });
  </script>
</body>
</html>
